<svg viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="800" fill="#F8FAFC"/>

  <text x="500" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#1E293B">Mapa Mental: O Conceito de Commit</text>
  <text x="500" y="66" text-anchor="middle" font-size="14" fill="#64748B">Uma fotografia, um hash, uma linha do tempo e uma mensagem</text>

  <!-- linhas de conexão -->
  <path d="M 445 340 Q 320 230 210 195" fill="none" stroke="#F97316" stroke-width="5" opacity="0.55" stroke-linecap="round"/>
  <path d="M 560 335 Q 690 230 790 195" fill="none" stroke="#10B981" stroke-width="5" opacity="0.55" stroke-linecap="round"/>
  <path d="M 435 460 Q 300 570 205 605" fill="none" stroke="#3B82F6" stroke-width="5" opacity="0.55" stroke-linecap="round"/>
  <path d="M 565 460 Q 700 570 795 605" fill="none" stroke="#EC4899" stroke-width="5" opacity="0.55" stroke-linecap="round"/>
  <path d="M 500 490 Q 500 600 500 645" fill="none" stroke="#EAB308" stroke-width="5" opacity="0.55" stroke-linecap="round"/>

  <!-- nó central -->
  <circle cx="500" cy="400" r="92" fill="#4C1D95"/>
  <circle cx="500" cy="400" r="92" fill="none" stroke="#7C3AED" stroke-width="3"/>
  <text x="500" y="394" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">COMMIT</text>
  <text x="500" y="418" text-anchor="middle" font-size="12" fill="#DDD6FE">uma fotografia do código</text>

  <!-- nó 1: fotografia (topo-esquerda, laranja) -->
  <circle cx="200" cy="160" r="70" fill="#F97316"/>
  <text x="200" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">📸 Fotografia</text>
  <text x="200" y="170" text-anchor="middle" font-size="11" fill="#FFEDD5">do momento</text>
  <text x="200" y="256" text-anchor="middle" font-size="12.5" fill="#7C2D12">
    <tspan x="200" dy="0">Registra o estado exato</tspan>
    <tspan x="200" dy="16">dos arquivos naquele</tspan>
    <tspan x="200" dy="16">instante.</tspan>
  </text>

  <!-- nó 2: identidade (topo-direita, verde) -->
  <circle cx="800" cy="160" r="70" fill="#10B981"/>
  <text x="800" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">🔑 Identidade</text>
  <text x="800" y="170" text-anchor="middle" font-size="11" fill="#D1FAE5">única</text>
  <text x="800" y="256" text-anchor="middle" font-size="12.5" fill="#064E3B">
    <tspan x="800" dy="0">Cada commit ganha um</tspan>
    <tspan x="800" dy="16">hash exclusivo, como</tspan>
    <tspan x="800" dy="16">uma impressão digital.</tspan>
  </text>

  <!-- nó 3: linha do tempo (baixo-esquerda, azul) -->
  <circle cx="185" cy="620" r="70" fill="#3B82F6"/>
  <text x="185" y="612" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">🧬 Linha do</text>
  <text x="185" y="632" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">tempo</text>
  <text x="185" y="530" text-anchor="middle" font-size="12.5" fill="#1E3A8A">
    <tspan x="185" dy="0">Aponta para o commit</tspan>
    <tspan x="185" dy="16">anterior, formando uma</tspan>
    <tspan x="185" dy="16">corrente de eventos.</tspan>
  </text>

  <!-- nó 4: mensagem (baixo-direita, rosa) -->
  <circle cx="815" cy="620" r="70" fill="#EC4899"/>
  <text x="815" y="612" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">💬 Mensagem</text>
  <text x="815" y="632" text-anchor="middle" font-size="11" fill="#FCE7F3">que explica</text>
  <text x="815" y="530" text-anchor="middle" font-size="12.5" fill="#831843">
    <tspan x="815" dy="0">Explica o porquê da</tspan>
    <tspan x="815" dy="16">mudança, não apenas</tspan>
    <tspan x="815" dy="16">o que mudou.</tspan>
  </text>

  <!-- nó 5: stage (base, amarelo) -->
  <circle cx="500" cy="700" r="65" fill="#EAB308"/>
  <text x="500" y="692" text-anchor="middle" font-size="14" font-weight="700" fill="#422006">🛠️ Nasce do</text>
  <text x="500" y="710" text-anchor="middle" font-size="14" font-weight="700" fill="#422006">Stage</text>
  <text x="500" y="770" text-anchor="middle" font-size="12.5" fill="#713F12">
    <tspan x="500" dy="0">Só o que passou pelo "git add" vira parte da fotografia final.</tspan>
  </text>
</svg>
