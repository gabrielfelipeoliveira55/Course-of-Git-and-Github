<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <radialGradient id="bgGrad2" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#212121"/>
      <stop offset="60%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#191919"/>
    </radialGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#E2E8F0"/>
    </marker>
    <marker id="arrowgray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#71717A"/>
    </marker>
  </defs>
  <rect width="1000" height="560" fill="url(#bgGrad2)"/>

  <text x="500" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#F8FAFC">O Caminho de um Arquivo: Modified → Staged → Committed</text>
  <text x="500" y="66" text-anchor="middle" font-size="14" fill="#A1A1AA">Todo arquivo rastreado pelo Git está sempre em um destes três estados</text>

  <!-- seta 1: modified -> staged -->
  <path d="M 295 250 L 380 250" fill="none" stroke="#E2E8F0" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="337" y="235" text-anchor="middle" font-size="13" font-weight="700" fill="#E2E8F0">git add</text>

  <!-- seta de volta: staged -> modified -->
  <path d="M 380 305 Q 337 335 295 305" fill="none" stroke="#71717A" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrowgray)"/>
  <text x="337" y="356" text-anchor="middle" font-size="11" fill="#A1A1AA">git restore --staged</text>

  <!-- seta 2: staged -> committed -->
  <path d="M 645 250 L 730 250" fill="none" stroke="#E2E8F0" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="687" y="228" text-anchor="middle" font-size="12" font-weight="700" fill="#E2E8F0">
    <tspan x="687" dy="0">git commit</tspan>
    <tspan x="687" dy="14">-m</tspan>
  </text>

  <!-- box 1: Modified -->
  <rect x="55" y="150" width="240" height="200" rx="22" fill="#F59E0B"/>
  <text x="175" y="200" text-anchor="middle" font-size="34">📝</text>
  <text x="175" y="232" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">Modified</text>
  <text x="175" y="253" text-anchor="middle" font-size="12" fill="#FEF3C7">(Modificado)</text>
  <text x="175" y="290" text-anchor="middle" font-size="12" fill="#FDE68A">
    <tspan x="175" dy="0">Alterado no diretório</tspan>
    <tspan x="175" dy="16">de trabalho, mas o Git</tspan>
    <tspan x="175" dy="16">ainda não foi avisado.</tspan>
  </text>

  <!-- box 2: Staged -->
  <rect x="380" y="150" width="240" height="200" rx="22" fill="#3B82F6"/>
  <text x="500" y="200" text-anchor="middle" font-size="34">📦</text>
  <text x="500" y="232" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">Staged</text>
  <text x="500" y="253" text-anchor="middle" font-size="12" fill="#DBEAFE">(Preparado)</text>
  <text x="500" y="290" text-anchor="middle" font-size="12" fill="#BFDBFE">
    <tspan x="500" dy="0">Marcado para entrar</tspan>
    <tspan x="500" dy="16">no próximo commit.</tspan>
    <tspan x="500" dy="16">Está "na fila".</tspan>
  </text>

  <!-- box 3: Committed -->
  <rect x="730" y="150" width="240" height="200" rx="22" fill="#10B981"/>
  <text x="850" y="200" text-anchor="middle" font-size="34">✅</text>
  <text x="850" y="232" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">Committed</text>
  <text x="850" y="253" text-anchor="middle" font-size="12" fill="#D1FAE5">(Commitado)</text>
  <text x="850" y="290" text-anchor="middle" font-size="12" fill="#A7F3D0">
    <tspan x="850" dy="0">Gravado de forma</tspan>
    <tspan x="850" dy="16">permanente no histórico</tspan>
    <tspan x="850" dy="16">do repositório.</tspan>
  </text>

  <!-- rodapé explicativo -->
  <text x="500" y="420" text-anchor="middle" font-size="13" fill="#A1A1AA">💡 "git status" mostra, a qualquer momento, em qual desses três estados cada arquivo está.</text>
</svg>
